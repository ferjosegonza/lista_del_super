<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="appScreen" class="app-container">
        <div class="app-header">
            <h1>🛒 Lista de Compras</h1>
            <div class="user-info">
                <span class="text-muted">⚡ Modo local</span>
                <button id="btnLimpiarTodo" class="btn-logout-sm btn-danger">🗑️ Limpiar todo</button>
            </div>
        </div>

        <!-- Área de carga masiva de WhatsApp -->
        <div class="whatsapp-import-section">
            <div class="whatsapp-header">
                <span>📱 <strong>Importar desde WhatsApp</strong></span>
                <button id="btnToggleWhatsApp" class="btn-sm btn-primary" style="font-size:0.7rem;">▼ Mostrar</button>
            </div>
            <div id="whatsappArea" style="display: none;">
                <textarea id="whatsappText" placeholder="Pegá acá los mensajes copiados de WhatsApp...&#10;&#10;Ejemplo:&#10;[11/7, 21:36] Lau Amor: Líquido para piso&#10;[11/7, 21:36] Lau Amor: Dulce de leche&#10;[11/7, 21:36] Lau Amor: Leche" rows="5"></textarea>
                <div class="whatsapp-actions">
                    <button id="btnProcesarWhatsApp" class="btn-success btn-sm">📥 Procesar mensajes</button>
                    <button id="btnLimpiarWhatsApp" class="btn-secondary btn-sm">🗑️ Limpiar</button>
                    <span id="whatsappCount" class="text-muted" style="font-size:0.75rem;">0 items detectados</span>
                </div>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="item-input" placeholder="Producto..." autocomplete="off">
            <input type="number" id="cantidad-input" placeholder="Cant." value="1" min="1" step="1">
            <input type="number" id="price-input" placeholder="$ Precio c/u" step="0.01">
            <button id="btnAgregar" class="btn-success">+ Agregar</button>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">📋 Sin precio</span>
                <span id="totalSinPrecio" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">💰 Con precio</span>
                <span id="totalConPrecio" class="stat-value">0</span>
                <span id="sumaConPrecio" class="stat-small">$0</span>
            </div>
            <div class="stat-item total">
                <span class="stat-label">🛒 En chango</span>
                <span id="totalEnChango" class="stat-value">0</span>
                <span id="sumaEnChango" class="stat-small">$0</span>
            </div>
        </div>

        <!-- Lista de ítems SIN precio -->
        <div class="section-header">
            <h3>📝 Sin precio <span id="sinPrecioCount" class="badge">0</span></h3>
        </div>
        <ul id="lista-sin-precio" class="lista-compras"></ul>

        <!-- Lista de ítems CON precio (fuera del chango) -->
        <div class="section-header">
            <h3>💰 Con precio <span id="conPrecioCount" class="badge">0</span></h3>
        </div>
        <ul id="lista-con-precio" class="lista-compras"></ul>

        <!-- Lista de ítems EN EL CHANGO -->
        <div class="section-header chango-header">
            <h3>🛒 En el chango <span id="enChangoItemsCount" class="badge badge-warning">0</span></h3>
            <button id="btnLimpiarChango" class="btn-sm btn-warning">🗑️ Limpiar chango</button>
        </div>
        <ul id="lista-en-chango" class="lista-compras chango-list"></ul>

        <div class="action-bar">
            <button id="btnLimpiarSinPrecio" class="btn-danger btn-sm">🗑️ Sin precio</button>
            <button id="btnLimpiarConPrecio" class="btn-danger btn-sm">🗑️ Con precio</button>
            <button id="btnLimpiarChango" class="btn-warning btn-sm">🗑️ En chango</button>
            <button id="btnDeshacer" class="btn-secondary btn-sm" disabled>↩️ Deshacer</button>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Título</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
